# @package _global_
defaults:
  - /camera@rendering.training: observation
  - /culling@rendering.route.culling: default
  - /culling@rendering.goal_views.culling: default
  - _self_
input:
  scene_dir: ???
rendering:
  route:
    width: 640
    height: 480
    supersample: 2
    camera_height_m: 0.9
    vertical_fov_deg: 75.0
    jpeg_quality: 95
    sample_every: 10
    path_stride_m: 0.005
    path_scale_m: 0.03
    path_width_m: 0.001
    path_width_samples: 9
    path_height_m: 0.3
    path_fade_m: 0.05
    path_opacity: 0.9999
    path_opacity_min: 0.000001
  goal_circle:
    radius_m: 0.5
    stride_m: 0.005
    width_m: 0.06
    width_samples: 5
    scale_m: 0.01
    lift_m: 0.03
    opacity: 0.9999
    ground_band_m: 0.1
    ground_max_m: 0.5
    ground_quantile: 0.9
  goal_views:
    # The goal region spans region_half_m around the goal along X and Z, and
    # region_height_m up from the local ground.
    region_half_m: 0.5
    region_height_m: 1.2
    # Candidate cameras stand camera_height_m above the ground on a square grid
    # of grid_step_m within radius_m of the goal.
    camera_height_m: 1.2
    grid_step_m: 0.4
    radius_m: 4.0
    # Framing: the projected region is inside the image with this margin, and
    # its shorter side covers at most this fraction of the image side.
    edge_margin_px: 4
    max_short_ratio: 0.6
    # Visibility renders use the image size divided by probe_downsample.
    probe_downsample: 4
    # A pixel shows the region when the scene depth is within this distance
    # of the depth of the region rendered alone.
    depth_tolerance_m: 0.05
    voxel_size_m: 0.02
    maximum: 3
    width: 640
    height: 480
    supersample: 2
    vertical_fov_deg: 75.0
    jpeg_quality: 95
execution:
  gpus: [0]
hydra:
  job:
    chdir: false
  run:
    dir: outputs/render_trajectories/${now:%Y-%m-%d_%H-%M-%S}
