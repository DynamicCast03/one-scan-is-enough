[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "one-scan-is-enough"
version = "0.1.0"
description = "Adapt a language-guided navigation policy to a building from one RGB-D scan"
readme = "README.md"
authors = [
  { name = "Zhuoyuan Yu" },
  { name = "Yuxing Long" },
  { name = "Du Wang" },
  { name = "Junyang Wang" },
  { name = "Hongwei Fan" },
  { name = "Hao Dong" },
]
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10,<4",
  "hydra-core>=1.3,<1.4",
  "numpy>=1.24,<3",
  "numba>=0.60,<1",
  "open3d>=0.18,<0.20",
  "opencv-contrib-python>=4.8,<5",
  "plyfile>=1.1,<2",
  "Pillow>=10,<12",
  "scipy>=1.10,<2",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
rendering = ["torch>=2.5,<3", "torchvision>=0.20,<1", "gsplat>=1.5,<2"]
instruction = ["openai>=2.11,<4"]
policy = ["torch>=2.5,<3", "transformers>=4.57,<4.58"]
posttrain = [
  "one-scan-is-enough[policy,rendering]",
  "accelerate>=1.0",
  "deepspeed>=0.16",
  "torchao>=0.9,<0.10",
]
evaluation = ["one-scan-is-enough[policy,rendering]"]

[project.urls]
Homepage = "https://one-scan-is-enough.github.io/"
Repository = "https://github.com/DynamicCast03/one-scan-is-enough"
Paper = "https://arxiv.org/abs/2610.33794"

[project.scripts]
prepare-scene = "one_scan_is_enough.apps.prepare_scene:main"
plan-trajectories = "one_scan_is_enough.apps.plan_trajectories:main"
render-trajectories = "one_scan_is_enough.apps.render_trajectories:main"
generate-instructions = "one_scan_is_enough.apps.generate_instructions:main"
posttrain-policy = "one_scan_is_enough.apps.posttrain_policy:main"
evaluate-policy = "one_scan_is_enough.apps.evaluate_policy:main"
convert-capture = "one_scan_is_enough.apps.convert_capture:main"
export-pgsr = "one_scan_is_enough.apps.export_pgsr:main"
train-pgsr = "one_scan_is_enough.apps.train_pgsr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
one_scan_is_enough = ["config/apps/*.yaml", "config/camera/*.yaml", "config/culling/*.yaml", "config/environment/*.yaml", "config/llm/*.yaml", "config/path_sampling/*.yaml", "config/planner/*.yaml", "config/planning_map/*.yaml", "preparation/*.html"]

[tool.ruff]
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
